name: kcalm
description: "App Flutter per il tracciamento di calorie e peso con budget calorico context-aware"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1


# ---
environment:
  sdk: ^3.13.4

# ---
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  dynamic_color: ^2.1.0
  shared_preferences: ^2.5.6
  flutter_localizations:
    sdk: flutter

# ---
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# ---
flutter:
  uses-material-design: true

  assets:
     - localizable/